<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM · Mujeres Inmobiliarias</title>
<style>
  :root {
    --ink: #1C2128;
    --ink-soft: #2A313C;
    --paper: #F7F6F3;
    --paper-dim: #EEECEA;
    --line: #E0DDD8;
    --teal: #2D6A6A;
    --teal-soft: #E3EEEC;
    --teal-mid: #3D8A8A;
    --terracotta: #B5564A;
    --terra-soft: #F5E6E3;
    --amber: #A87B22;
    --amber-soft: #F3ECD9;
    --gray: #6B7280;
    --gray-light: #9CA3AF;
    --white: #FFFFFF;
    --green: #2D6A4A;
    --green-soft: #E3EEE8;
    --sidebar-w: 240px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; }

  /* SIDEBAR */
  .sidebar { width: var(--sidebar-w); background: #0F1923; color: #fff; display: flex; flex-direction: column; padding: 20px 14px; flex-shrink: 0; min-height: 100vh; position: fixed; top: 0; left: 0; bottom: 0; z-index: 10; }
